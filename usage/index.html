<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>gpuism usage</title>
  <style>
    :root {
      --bg: #14120e;
      --bg-2: #1c1813;
      --ink: #f3efe6;
      --muted: #b7ab9a;
      --line: #3a332b;
      --copper: #e0a15a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
    .eyebrow { letter-spacing: 0.14em; text-transform: uppercase; color: var(--copper); font-size: 12px; }
    h1 { font-size: 40px; line-height: 1.05; margin: 8px 0 12px; font-weight: 650; }
    h2 { font-size: 22px; margin: 28px 0 8px; }
    h3 { font-size: 15px; margin: 16px 0 6px; color: var(--muted); font-weight: 650; }
    p { line-height: 1.45; }
    a { color: var(--copper); }
    code { color: #f6d7b0; }
    .lede { color: var(--muted); }
    .fine { color: var(--muted); font-size: 13px; line-height: 1.45; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: baseline; }
    td:last-child { text-align: right; white-space: nowrap; }
    ul.counts { list-style: none; padding: 0; margin: 0 0 8px; }
    ul.counts li { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
    .how { background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px 12px; margin-top: 28px; }
  </style>
</head>
<body>
  <main id="usage-root">
    <p class="eyebrow">gpuism usage</p>
    <p>Loading totals…</p>
  </main>
  <script type="module" src="../static/usage-report.js?v=870b0d5e2c-1759a639"></script>
</body>
</html>
